list => (list || []).reduce((b, x) => (isFinite(num(x && x.value)) && (!b || num(x.value) > num(b.value)) ? x : b), null);\n/* 折扣最低（最划算）的下标；只有一项时不标记 */\nconst bestOf = (list, get) => {\n  let bi = -1, bv = Infinity;\n  list.forEach((x, i) => { const v = num(get(x)); if (isFinite(v) && v < bv) { bv = v; bi = i; } });\n  return list.length > 1 ? bi : -1;\n};\n/* 名称对：TokenPlan（产品 + 档位）、模型（模型 + 厂商），始终一行不换行 */\nconst pairHTML = (a, b, fit) => `<span class=\"pn\"${fit ? ` data-fit=\"${fit}\"` : ''}><span class=\"pa\">${esc(a)}</span>${has(b) ? `<span class=\"pb\">${esc(b)}</span>` : ''}</span>`;\nconst planName = (p, fit) => pairHTML(p.product, p.tier, fit);\nconst modelName = (m, fit) => pairHTML(m.model, m.provider, fit);\n/* 模型标签：模型出现的每一处都用它，一行，模型名 + 厂商，外加细框 */\nconst chip = (m, fit) => `<span class=\"chip\"${fit ? ` data-fit=\"${fit}\"` : ''}><span class=\"ca\">${esc(m.model)}</span>${has(m.provider) ? `<span class=\"cb\">${esc(m.provider)}</span>` : ''}</span>`;\n/* 多套餐时的共同语境 */\nconst ctx = () => {\n  const ms = plans.map(model0);\n  return {\n    ms,\n    sameProd: plans.length > 0 && plans.every(p => p.product === plans[0].product),\n    sameModel: ms.length > 0 && ms.every(m => m.model === ms[0].model)\n  };\n};\nconst ratioHTML = m => `${esc(m.ratio)}<span class=\"unit\">${esc(m.ratioUnit || '')}</span>`;\n\n/* data-fit：超出容器时缩小字号；同名分组取最小值，保证一行里字号一致 */\nfunction fitAll() {\n  const groups = {};\n  document.querySelectorAll('[data-fit]').forEach(el => {\n    const par = el.parentElement, cs = getComputedStyle(par);\n    const max = par.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);\n    let s = parseFloat(getComputedStyle(el).fontSize);\n    while (el.getBoundingClientRect().width > max && s > 12) { s -= 1; el.style.fontSize = s + 'px'; }\n    const g = el.dataset.fit;\n    if (g) (groups[g] = groups[g] || []).push([el, s]);\n  });\n  Object.values(groups).forEach(list => {\n    const m = Math.min(...list.map(x => x[1]));\n    list.forEach(([el]) => { el.style.fontSize = m + 'px'; });\n  });\n}\n/* data-r：按 0–1 比例横向定位，并夹在容器内 */\nfunction placeAll() {\n  document.querySelectorAll('[data-r]').forEach(el => {\n    const W = el.parentElement.clientWidth, w = el.offsetWidth, r = +el.dataset.r;\n    el.style.left = Math.min(Math.max(r * W - w / 2, 0), W - w) + 'px';\n  });\n}\nfunction boot(render) {\n  document.getElementById('root').innerHTML = render();\n  const text = document.body.innerText;\n  const loads = document.fonts ? [200, 300, 400, 500, 600].flatMap(w => [\n    document.fonts.load(w + ' 40px \"Inter\"', text),\n    document.fonts.load(w + ' 40px \"Noto Sans SC\"', text)\n  ]) : [];\n  Promise.all(loads).catch(() => {}).then(() => document.fonts && document.fonts.ready).then(() => {\n    fitAll(); placeAll();\n    document.documentElement.dataset.ready = '1';\n  });\n}\n\n","boot(function () {\n","  const p = plans[0] || {}, ms = p.models || [];\n","  const pl = ((ms[0] || {}).prices || []).map(r => r.label);\n","  const best = bestOf(ms, m => m.ratio);\n","  const monthly = m => { const t = topQuota(m.quota); return t ? t.value : ''; };\n","  return `<div class=\"canvas\" style=\"--pc:${Math.max(pl.length, 1)}\">\n","    <header class=\"top\">\n","      ${planName(p)}\n","      ${has(p.fee) ? `<div class=\"fee\"><div class=\"k\">${esc(L.fee)}</div><div class=\"v n\">${esc(p.fee)}</div></div>` : ''}\n","    </header>\n","    <section class=\"body\">\n","      ${pl.length ? `<div class=\"r\"><span></span><span></span><span></span><div class=\"grp\"><span>${esc(L.prices)}</span><span class=\"u\">${esc(L.unit)}</span></div></div>` : ''}\n      <div class=\"r hd\"><span></span><span>${esc(L.ratio)}</span><span class=\"end\">${esc(L.monthly)}</span>${pl.map(x => `<span class=\"end\">${esc(x)}</span>`).join('')}</div>\n      ${ms.map((m, i) => `<div class=\"r row\">\n        <div>${chip(m, 'chip')}</div>\n        <div><span class=\"fit disc n${i === best ? ' best' : ''}\" data-fit=\"disc\">${ratioHT   if (!Array.isArray(plans) || !plans.length || plans.some(p =>
      !present(p?.product) || !Array.isArray(p.models) || !p.models.length || p.models.some(m => !present(m?.model)))) {
    throw Error("请填写套餐名称和每个模型的名称。");
  }
  const scene = plans.length > 1 ? "plans" : plans[0].models.length > 1 ? "models" : "single";
  if (plans.length > 4 || plans.some(p => p.models.length > 4) || (scene === "plans" && plans.some(p => p.models.length !== 1))) {
    throw Error("请按模型分组，每张卡比较至多四个套餐或模型。");
  }
  const models = plans.flatMap(p => p.models);
  for (const model of models) {
    for (const field of ["prices", "quota"]) {
      const rows = model[field];
      if (rows == null) continue;
      if (!Array.isArray(rows) || rows.some(row => !present(row?.label)) || new Set(rows.map(row => row.label)).size !== rows.length) {
        throw Error("每个模型的 "+field+" 需要使用不同的非空标签。");
      }
    }
    if (model.ratio != null && (typeof model.ratio !== "number" || !Number.isFinite(model.ratio) || model.ratio < 0)) {
      throw Error("ratio 应为非负数值因子，例如 0.05。");
    }
  }
  const requested = data.theme;
  const explicit = requested != null && requested !== "auto";
  if (explicit && !Object.hasOwn(styles, requested)) throw Error("theme 可选 white、night、field 或 auto。");
  const tallNight = scene === "models" && models.length === 4 && models.some(m => m.prices?.length);
  const style = explicit ? requested : tallNight ? "white" : fallback[scene];
  if (style === "night" && tallNight) throw Error("夜幕多模型卡含费率时，单卡最多放三个模型。请分卡或选择其他风格。");
  if (style === "night" && scene !== "models" &&
      plans.some(p => present(p.fee) && !p.models[0].quota?.some(hasAmount))) {
    throw Error("此夜幕版的月费显示在额度刻度上。请提供正值额度，或选用素白、色域。");
  }
  const [width,height] = style === "field" ? [1600,900] : [1080,1350];
  return {file: styles[style] + "-" + scene + ".html", scene, style, width, height};
}

function quotaOrder(models) {
  const lists = models.map(m => (m.quota || []).map(row => row.label));
  const pending = [...new Set(lists.flat())];
  const labels = [];
  while (pending.length) {
    const index = pending.findIndex(label => lists.every(list => list.indexOf(label) <= 0));
    if (index < 0) throw Error("额度窗口顺序冲突，请统一按重置时长从短到长排列。");
    const [label] = pending.splice(index, 1);
    labels.push(label);
    for (const list of lists) if (list[0] === label) list.shift();
  }
  return labels;
}

function formatRatios(models, unit) {
  const factor = unit === "折" ? 10 : 1;
  const ratios = [...new Set(models.map(m => m.ratio).filter(n => n != null))].sort((a,b) => a-b);
  let formatter;
  for (let digits = 6; digits <= 17; digits++) {
    formatter = new Intl.NumberFormat("zh-CN", {maximumSignificantDigits: digits, useGrouping: false});
    if (ratios.length < 2 || formatter.format(ratios[0] * factor) !== formatter.format(ratios[1] * factor)) break;
  }
  return value => value == null ? "" : formatter.format(value * factor);
}

function fillTemplate(source, data, {scene, style}) {
  const unit = data.ratioUnit === "×" ? "×" : "折";
  const models = data.plans.flatMap(p => p.models);
  const ratio = formatRatios(models, unit);
  const priceLabels = scene === "models" ? [...new Set(models.flatMap(m => (m.prices || []).map(row => row.label)))] : [];
  const shareQuotaRows = scene === "plans" && style !== "night";
  const quotaLabels = shareQuotaRows ? quotaOrder(models) : [];
  const align = (labels, items) => {
    const byLabel = new Map((items || []).map(item => [item.label, item]));
    return labels.map(label => byLabel.get(label) || {label});
  };
  const isMonthly = row => row.window != null ? row.window === "month" :
    /^(?:(?:每月|月度|月)(?:等值)?(?:额度)?|monthly)$/i.test(row.label.trim());
  const plans = data.plans.map(plan => ({
    ...plan,
    models: plan.models.map(model => ({
      ...model,
      ratio: ratio(model.ratio),
      ratioUnit: model.ratio == null ? "" : unit,
      prices: scene === "models" ? align(priceLabels, model.prices) : model.prices,
      quota: shareQuotaRows ? align(quotaLabels, model.quota)
        : scene === "models" && style !== "night" ? (model.quota || []).filter(isMonthly) : model.quota
    }))
  }));
  const pattern = /(<script type="application\/json" id="card-data">)[\s\S]*?(<\/script>)/g;
  if ([...source.matchAll(pattern)].length !== 1) throw Error("原版模板缺少唯一的 #card-data");
  const json = JSON.stringify({title: data.title, labels: data.labels, plans}, null, 2).replace(/</g, "\\u003c");
  return source.replace(pattern, (_, start, end) => start + "\n" + json + "\n" + end);
}

const bundle = JSON.parse(document.getElementById("card-templates").textContent);
function generate(data) {
  const spec = selectTemplate(data);
  const source = bundle.layouts[spec.file].map(id => bundle.parts[id]).join("");
  return {...spec, html:fillTemplate(source, data, spec)};
}

window.tokenUsageCard = {generate};
const input = document.getElementById("card-data").textContent;
if (input.trim() !== "null") {
  document.addEventListener("DOMContentLoaded", () => {
    try {
      const {html} = generate(JSON.parse(input));
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      document.body.textContent = error.message;
    }
  }, {once:true});
}
})();
</script>
</body>
</html>
